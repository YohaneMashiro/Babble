name: Publish Babble to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/g2pw/requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install application dependencies
        run: npm ci

      - name: Check application behavior and types
        run: |
          npm test -- --maxWorkers=2
          npm run lint

      - name: Install model build dependencies
        run: python -m pip install --disable-pip-version-check -r tools/g2pw/requirements.txt

      - name: Restore fixed model inputs and quantized weights
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/babble-g2pw/G2PWModel-v2-onnx.zip
            ${{ runner.temp }}/babble-g2pw/g2pw.int8.onnx
            ${{ runner.temp }}/babble-g2pw/inputs
          key: g2pw-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('data/g2pw-model.lock.json', 'tools/g2pw/requirements.txt', 'tools/g2pw/sources.json') }}

      - name: Prepare verified browser model resources
        run: python tools/g2pw/prepare.py --cache "$RUNNER_TEMP/babble-g2pw" --download

      - name: Verify generated metadata matches the checked-in source
        run: git diff --exit-code --stat -- data/g2pw-model.lock.json public/models/g2pw

      - name: Build complete static site
        run: npm run build

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
